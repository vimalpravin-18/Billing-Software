# ==============================================================================
# BakeryPOS — Apache HTTP Server Production Configuration
# File: apache-bakerypos.conf
#
# This file configures:
#  1. Static file hosting for React Frontend (dist/ directory)
#  2. Single Page Application (SPA) client-side URL rewriting (prevents 404 on refresh)
#  3. Reverse Proxy forwarding /api requests to Spring Boot Backend (port 8080)
#  4. Production SSL / HTTPS termination
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. REQUIRED APACHE MODULES
# Ensure these modules are enabled in your main httpd.conf:
#
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   LoadModule rewrite_module modules/mod_rewrite.so
#   LoadModule headers_module modules/mod_headers.so
#   LoadModule deflate_module modules/mod_deflate.so
#   LoadModule ssl_module modules/mod_ssl.so           (for HTTPS)
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 2. HTTP VIRTUAL HOST (Port 80)
# Option A: Direct serving on Port 80 (Local LAN / Intranet / Pre-SSL)
# Option B: Automatic 301 Redirect to HTTPS Port 443
# ------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName pos.yourbakery.com
    ServerAlias www.pos.yourbakery.com
    # ServerAlias localhost

    # --- UNCOMMENT BELOW TO FORCE HTTPS IN PRODUCTION ---
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # --- DIRECT SERVING OVER HTTP (Change path to your dist directory) ---
    DocumentRoot "C:/Apache24/htdocs/bakery"
    # Or Linux: DocumentRoot "/var/www/bakerypos/dist"

    <Directory "C:/Apache24/htdocs/bakery">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA Routing: Any route that is not an existing file or directory
        # must be routed to index.html so React Router can handle it.
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # --- REVERSE PROXY TO SPRING BOOT BACKEND ---
    # Forwards all /api calls directly to Spring Boot running on port 8080
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /api http://127.0.0.1:8080/api
    ProxyPassReverse /api http://127.0.0.1:8080/api

    # Logging
    ErrorLog "logs/bakerypos_error.log"
    CustomLog "logs/bakerypos_access.log" combined
</VirtualHost>

# ------------------------------------------------------------------------------
# 3. HTTPS SECURE VIRTUAL HOST (Port 443 - PRODUCTION RECOMMENDED)
# ------------------------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pos.yourbakery.com
    ServerAlias www.pos.yourbakery.com

    DocumentRoot "C:/Apache24/htdocs/bakery"
    # Or Linux: DocumentRoot "/var/www/bakerypos/dist"

    SSLEngine on
    SSLCertificateFile    "conf/ssl/bakerypos.crt"
    SSLCertificateKeyFile "conf/ssl/bakerypos.key"
    # SSLCertificateChainFile "conf/ssl/chain.crt"

    <Directory "C:/Apache24/htdocs/bakery">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Reverse Proxy to Spring Boot Backend
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /api http://127.0.0.1:8080/api
    ProxyPassReverse /api http://127.0.0.1:8080/api

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    ErrorLog "logs/bakerypos_ssl_error.log"
    CustomLog "logs/bakerypos_ssl_access.log" combined
</VirtualHost>
</IfModule>
