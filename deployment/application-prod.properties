# ==============================================================================
# BakeryPOS — Spring Boot Production Properties Template
# Place in backend/src/main/resources/ or pass via --spring.config.location=...
# ==============================================================================

spring.application.name=bakerypos-backend
server.port=${PORT:8080}

# PostgreSQL Production Database Connection
# Replace with your production DB host, port, database name, and credentials
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Production Settings
# 'validate' ensures schema matches entities without modifying production data.
# Use 'update' on first deployment if creating tables automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security (Set via JWT_SECRET environment variable in production)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS Configuration
# When using Apache reverse proxy (/api), CORS is not needed since frontend & backend
# share the same origin. For direct calls from separate domains, list them below:
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Production Logging
logging.level.com.bakerypos=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR
logging.file.name=logs/bakerypos-backend.log
